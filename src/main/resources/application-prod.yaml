spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    test-connection: false
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    info:
      enabled: false
    metrics:
      enabled: false
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.connections.pooling: WARN
    com.zaxxer.hikari: WARN

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: none
        path: /

lazydeploy:
  game-tools-base-url: ${GAME_TOOLS_BASE_URL:https://api.gametools.network}
  battlelog-keeper-base-url: ${BATTLELOG_KEEPER_BASE_URL:https://keeper.battlelog.com}
  email-from: ${MAIL_FROM}
  security:
    cors:
      allowed-origins:
        - ${LAZYDEPLOY_FRONTEND_ORIGIN}
      allow-credentials: true
      allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN
      exposed-headers: Retry-After
      max-age-seconds: 3600
    csrf-cookie:
      secure: true
      http-only: false
      same-site: none
      path: /
    headers:
      hsts:
        enabled: true
        max-age: 31536000s
        include-sub-domains: false
        preload: false
    rate-limit:
      proxy:
        trust-forwarded-headers: false
        trusted-proxies: []
