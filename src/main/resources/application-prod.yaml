spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    info:
      enabled: false
    metrics:
      enabled: false
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.connections.pooling: WARN
    com.zaxxer.hikari: WARN

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: none
        path: /

lazydeploy:
  game-tools-base-url: ${GAME_TOOLS_BASE_URL:https://api.gametools.network}
  battlelog-keeper-base-url: ${BATTLELOG_KEEPER_BASE_URL:https://keeper.battlelog.com}
  mailjet:
    base-url: ${MAILJET_BASE_URL:https://api.mailjet.com}
    api-key: ${MAILJET_API_KEY}
    api-secret: ${MAILJET_API_SECRET}
    from-email: ${MAILJET_FROM_EMAIL}
    from-name: ${MAILJET_FROM_NAME:LazyDeploy}
    connect-timeout-ms: ${MAILJET_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${MAILJET_RESPONSE_TIMEOUT_MS:10000}
    max-response-body-bytes: ${MAILJET_MAX_RESPONSE_BODY_BYTES:1048576}
  security:
    cors:
      allowed-origins:
        - ${LAZYDEPLOY_FRONTEND_ORIGIN}
      allow-credentials: true
      allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN
      exposed-headers: Retry-After
      max-age-seconds: 3600
    csrf-cookie:
      secure: true
      http-only: false
      same-site: none
      path: /
    headers:
      hsts:
        enabled: true
        max-age: 31536000s
        include-sub-domains: false
        preload: false
    rate-limit:
      proxy:
        trust-forwarded-headers: false
        trusted-proxies: []
