management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    info:
      enabled: false
    metrics:
      enabled: false
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.connections.pooling: WARN
    com.zaxxer.hikari: WARN

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: none
        path: /

lazydeploy:
  security:
    cors:
      allowed-origins:
        - ${LAZYDEPLOY_FRONTEND_ORIGIN}
      allow-credentials: true
      allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN
      exposed-headers: Retry-After
      max-age-seconds: 3600
    csrf-cookie:
      secure: true
      http-only: false
      same-site: none
      path: /
    headers:
      hsts:
        enabled: true
        max-age: 31536000s
        include-sub-domains: false
        preload: false
