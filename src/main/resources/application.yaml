spring:
  application:
    name: lazy-deploy
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lazydeploy}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [correlationId=%X{correlationId} cycleId=%X{cycleId}] - %msg%n"

server:
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:200}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health,info,metrics
  endpoint:
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    mappings:
      enabled: false
    conditions:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    loggers:
      enabled: false
    scheduledtasks:
      enabled: false
    caches:
      enabled: false
    httpexchanges:
      enabled: false
    startup:
      enabled: false
    shutdown:
      enabled: false
    health:
      show-details: when-authorized
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: false
    java:
      enabled: true
  metrics:
    tags:
      application: lazydeploy

info:
  app:
    name: LazyDeploy
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

lazydeploy:
  game-tools-base-url: https://api.gametools.network
  battlelog-keeper-base-url: https://keeper.battlelog.com
  mailjet:
    base-url: ${MAILJET_BASE_URL:https://api.mailjet.com}
    api-key: ${MAILJET_API_KEY:}
    api-secret: ${MAILJET_API_SECRET:}
    from-email: ${MAILJET_FROM_EMAIL:}
    from-name: ${MAILJET_FROM_NAME:LazyDeploy}
    connect-timeout-ms: ${MAILJET_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${MAILJET_RESPONSE_TIMEOUT_MS:10000}
    max-response-body-bytes: ${MAILJET_MAX_RESPONSE_BODY_BYTES:1048576}
  providers:
    game-tools:
      connect-timeout-ms: 2000
      response-timeout-ms: 5000
      max-concurrent-requests: 10
      max-response-body-bytes: 2097152
      retry:
        enabled: false
        max-attempts: 1
        backoff-ms: 0
    keeper:
      connect-timeout-ms: 2000
      response-timeout-ms: 4000
      max-concurrent-requests: 20
      max-response-body-bytes: 2097152
      retry:
        enabled: true
        max-attempts: 2
        backoff-ms: 250
    bflist:
      connect-timeout-ms: 2000
      response-timeout-ms: 5000
      max-concurrent-requests: 5
      max-response-body-bytes: 2097152
      retry:
        enabled: false
        max-attempts: 1
        backoff-ms: 0
  limits:
    subscriptions-per-user: 20
    rules-per-subscription: 10
    channels-per-subscription: 5
    maps-per-map-in-rule: 20
    server-search-query-min-length: 2
    server-search-query-max-length: 100
    default-page-size: 20
    max-page-size: 100
    max-page-number: 10000
    max-request-body-bytes: 1048576
  security:
    cors:
      allowed-origins:
        - ${LAZYDEPLOY_FRONTEND_ORIGIN:http://localhost:4200}
      allow-credentials: true
      allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN
      exposed-headers: Retry-After
      max-age-seconds: 3600
    csrf-cookie:
      secure: ${CSRF_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
      http-only: false
      same-site: lax
      path: /
    headers:
      hsts:
        enabled: false
        max-age: 31536000s
        include-sub-domains: false
        preload: false
    rate-limit:
      enabled: true
      login:
        ip:
          capacity: 10
          window: 60s
        identity:
          capacity: 5
          window: 5m
      register:
        capacity: 5
        window: 10m
      server-search:
        user:
          capacity: 30
          window: 60s
        ip:
          capacity: 60
          window: 60s
      subscription-configure:
        user:
          capacity: 10
          window: 10m
        ip:
          capacity: 20
          window: 10m
      cache:
        maximum-size: 10000
        expire-after-access: 30m
      proxy:
        trust-forwarded-headers: false
        trusted-proxies: []
  monitoring:
    interval: 30s
    round-reset-threshold-seconds: 30
    max-observation-gap: 5m
  resources:
    database:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MINIMUM_IDLE:2}
      connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:3000}
      idle-timeout-ms: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime-ms: ${DATABASE_MAX_LIFETIME_MS:1800000}
    monitoring-executor:
      core-pool-size: ${MONITORING_EXECUTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${MONITORING_EXECUTOR_MAX_POOL_SIZE:8}
      queue-capacity: ${MONITORING_EXECUTOR_QUEUE_CAPACITY:100}
      keep-alive-seconds: ${MONITORING_EXECUTOR_KEEP_ALIVE_SECONDS:60}
    http:
      max-threads: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare-threads: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
      max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:200}
      accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
      connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
    shutdown:
      timeout: ${SHUTDOWN_TIMEOUT:20s}
