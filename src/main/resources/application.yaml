spring:
  application:
    name: lazy-deploy
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lazydeploy}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

lazydeploy:
  game-tools-base-url: https://api.gametools.network
  battlelog-keeper-base-url: https://keeper.battlelog.com
  email-from: ${MAIL_FROM:${MAIL_USERNAME:}}
  monitoring:
    interval: 30s
    round-reset-threshold-seconds: 30
    max-observation-gap: 5m
