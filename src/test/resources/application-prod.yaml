spring:
  datasource:
    url: jdbc:h2:mem:lazydeploy-prod;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: test-password
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 2525
    username: test-user
    password: test-password
    test-connection: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    info:
      enabled: false
    metrics:
      enabled: false
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: none
        path: /

lazydeploy:
  email-from: test@example.com
  security:
    cors:
      allowed-origins:
        - https://lazydeploy.pages.dev
      allow-credentials: true
      allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN
      exposed-headers: Retry-After
      max-age-seconds: 3600
    csrf-cookie:
      secure: true
      http-only: false
      same-site: none
      path: /
    headers:
      hsts:
        enabled: true
        max-age: 31536000s
        include-sub-domains: false
        preload: false
