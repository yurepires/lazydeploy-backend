spring:
  datasource:
    url: jdbc:h2:mem:lazydeploy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: false
    java:
      enabled: true
  metrics:
    tags:
      application: lazydeploy

info:
  app:
    name: LazyDeploy
    version: "test"

lazydeploy:
  game-tools-base-url: https://api.gametools.network
  battlelog-keeper-base-url: https://keeper.battlelog.com
  email-from: test@example.com
  monitoring:
    interval: 30s
    round-reset-threshold-seconds: 30
    max-observation-gap: 5m
