spring:
  datasource:
    url: jdbc:h2:mem:lazydeploy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 5s

management:
  endpoints:
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health,info,metrics
  endpoint:
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    mappings:
      enabled: false
    conditions:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    loggers:
      enabled: false
    scheduledtasks:
      enabled: false
    caches:
      enabled: false
    httpexchanges:
      enabled: false
    startup:
      enabled: false
    shutdown:
      enabled: false
    health:
      show-details: when-authorized
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: false
    java:
      enabled: true
  metrics:
    tags:
      application: lazydeploy

info:
  app:
    name: LazyDeploy
    version: "test"

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
        path: /
  tomcat:
    threads:
      max: 10
      min-spare: 2
    max-connections: 50
    accept-count: 20
    connection-timeout: 5s

lazydeploy:
  game-tools-base-url: https://api.gametools.network
  battlelog-keeper-base-url: https://keeper.battlelog.com
  mailjet:
    base-url: https://api.mailjet.com
    api-key: test-api-key
    api-secret: test-api-secret
    from-email: test@example.com
    from-name: LazyDeploy Test
    connect-timeout-ms: 3000
    response-timeout-ms: 10000
    max-response-body-bytes: 1048576
  providers:
    game-tools:
      connect-timeout-ms: 2000
      response-timeout-ms: 5000
      max-concurrent-requests: 10
      max-response-body-bytes: 2097152
      retry:
        enabled: false
        max-attempts: 1
        backoff-ms: 0
    keeper:
      connect-timeout-ms: 2000
      response-timeout-ms: 4000
      max-concurrent-requests: 20
      max-response-body-bytes: 2097152
      retry:
        enabled: true
        max-attempts: 2
        backoff-ms: 250
    bflist:
      connect-timeout-ms: 2000
      response-timeout-ms: 5000
      max-concurrent-requests: 5
      max-response-body-bytes: 2097152
      retry:
        enabled: false
        max-attempts: 1
        backoff-ms: 0
  limits:
    subscriptions-per-user: 20
    rules-per-subscription: 10
    channels-per-subscription: 5
    maps-per-map-in-rule: 20
    server-search-query-min-length: 2
    server-search-query-max-length: 100
    default-page-size: 20
    max-page-size: 100
    max-page-number: 10000
    max-request-body-bytes: 1048576
  security:
    cors:
      allowed-origins:
        - http://localhost:4200
      allow-credentials: true
      allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN
      exposed-headers: Retry-After
      max-age-seconds: 3600
    csrf-cookie:
      secure: false
      http-only: false
      same-site: lax
      path: /
    headers:
      hsts:
        enabled: false
        max-age: 31536000s
        include-sub-domains: false
        preload: false
    rate-limit:
      enabled: true
      login:
        ip:
          capacity: 1000
          window: 60s
        identity:
          capacity: 1000
          window: 5m
      register:
        capacity: 1000
        window: 10m
      server-search:
        user:
          capacity: 1000
          window: 60s
        ip:
          capacity: 1000
          window: 60s
      subscription-configure:
        user:
          capacity: 1000
          window: 10m
        ip:
          capacity: 1000
          window: 10m
      cache:
        maximum-size: 10000
        expire-after-access: 30m
      proxy:
        trust-forwarded-headers: false
        trusted-proxies: []
  monitoring:
    interval: 30s
    round-reset-threshold-seconds: 30
    max-observation-gap: 5m
  resources:
    database:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout-ms: 1000
      idle-timeout-ms: 60000
      max-lifetime-ms: 300000
    monitoring-executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 10
      keep-alive-seconds: 30
    http:
      max-threads: 10
      min-spare-threads: 2
      max-connections: 50
      accept-count: 20
      connection-timeout: 5s
    shutdown:
      timeout: 5s
